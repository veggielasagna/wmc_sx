<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMC SX</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="stage" class="sky">
  <div class="bg" aria-hidden="true">
    <div class="corner"></div>
    <div class="swoop swB"></div>
    <div class="swoop swA"></div>
    <div class="swoop swC"></div>
    <svg class="waves" viewBox="0 0 3840 260" preserveAspectRatio="none">
      <defs><linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BFE4FF" stop-opacity="0"/><stop offset="0.25" stop-color="#BFE4FF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#BFE4FF" stop-opacity="0.08"/><stop offset="0.75" stop-color="#BFE4FF" stop-opacity="0.35"/><stop offset="1" stop-color="#BFE4FF" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 150 C 320 60, 640 240, 960 150 S 1600 60, 1920 150 S 2560 240, 2880 150 S 3520 60, 3840 150" fill="none" stroke="url(#ribbon)" stroke-width="3"/>
      <path d="M0 175 C 320 100, 640 230, 960 175 S 1600 100, 1920 175 S 2560 230, 2880 175 S 3520 100, 3840 175" fill="none" stroke="url(#ribbon)" stroke-width="1.5"/>
    </svg>
    <div class="glint" style="width:18px;height:18px;left:300px;animation-duration:22s;animation-delay:-4s"></div>
    <div class="glint" style="width:12px;height:12px;left:760px;animation-duration:18s;animation-delay:-12s"></div>
    <div class="glint" style="width:22px;height:22px;left:1240px;animation-duration:26s;animation-delay:-8s"></div>
    <div class="glint" style="width:14px;height:14px;left:1620px;animation-duration:20s;animation-delay:-16s"></div>
    <div class="vignette"></div>
  </div>

  <header id="brand">
    <div id="clock" class="clock"></div>
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 52 52" aria-hidden="true"><defs><radialGradient id="orb" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFD9A0"/><stop offset="0.6" stop-color="#F28A1E"/><stop offset="1" stop-color="#B5520A"/></radialGradient></defs><circle cx="26" cy="26" r="24" fill="url(#orb)" stroke="#FFE2B8" stroke-width="2"/><path d="M21 16 L36 26 L21 36 Z" fill="#fff"/><ellipse cx="26" cy="15" rx="16" ry="8" fill="#fff" fill-opacity="0.35"/></svg>
      <span>WMC SX</span>
    </div>
  </header>

  <main id="screen"></main>

  <div id="viewer" class="viewer hidden" aria-hidden="true">
    <img id="viewerA" class="vimg" alt="">
    <img id="viewerB" class="vimg" alt="">
    <div id="viewerMsg" class="vmsg hidden"><b>This photo can’t be shown</b><span>It’s in a format the Xbox can’t open (such as HEIC), and the media server didn’t offer a JPEG copy.</span></div>
    <div id="viewerInfo" class="vinfo"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="intro" class="intro hidden" aria-hidden="true">
    <div class="i-sky"></div>
    <div class="i-glow"></div>
    <div class="i-beams"></div>
    <svg class="i-ribbons" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <defs><linearGradient id="irib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.45" stop-color="#D6F3FF" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
      <path class="r r1" d="M-200 790 C 300 560, 860 940, 1380 650 S 1980 520, 2140 600"/>
      <path class="r r2" d="M-200 850 C 420 720, 980 990, 1480 740 S 2000 660, 2140 720"/>
      <path class="r r3" d="M-200 720 C 260 520, 760 790, 1260 580 S 1880 450, 2140 520"/>
    </svg>
    <div class="i-ring"></div>
    <div class="i-ring i-ring2"></div>
    <div class="i-orb">
      <svg viewBox="0 0 52 52"><defs><radialGradient id="iorb" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFE2B8"/><stop offset="0.55" stop-color="#F28A1E"/><stop offset="1" stop-color="#A84A08"/></radialGradient><linearGradient id="ishine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><circle cx="26" cy="26" r="24" fill="url(#iorb)" stroke="#FFE9C8" stroke-width="1.2"/><path d="M21 16 L36 26 L21 36 Z" fill="#fff"/><ellipse cx="26" cy="14.5" rx="16.5" ry="8.5" fill="url(#ishine)"/></svg>
    </div>
    <div class="i-flare"></div>
    <div class="i-title">WMC SX</div>
    <div class="i-sub">Music&nbsp;&nbsp;·&nbsp;&nbsp;Videos&nbsp;&nbsp;·&nbsp;&nbsp;Photos</div>
    <div class="i-bub" style="left:12%;width:46px;height:46px;animation-delay:1.2s"></div>
    <div class="i-bub" style="left:22%;width:22px;height:22px;animation-delay:1.6s"></div>
    <div class="i-bub" style="left:34%;width:70px;height:70px;animation-delay:1.0s"></div>
    <div class="i-bub" style="left:47%;width:28px;height:28px;animation-delay:2.0s"></div>
    <div class="i-bub" style="left:61%;width:54px;height:54px;animation-delay:1.3s"></div>
    <div class="i-bub" style="left:72%;width:18px;height:18px;animation-delay:1.8s"></div>
    <div class="i-bub" style="left:83%;width:62px;height:62px;animation-delay:1.1s"></div>
    <div class="i-bub" style="left:91%;width:30px;height:30px;animation-delay:2.2s"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
